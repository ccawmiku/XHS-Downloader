name: Verify and publish NAS image
on:
  push:
    branches: [master]
    tags: ['2.8-nas.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'ccawmiku/XHS-Downloader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3 lxml==6.1.3
      - run: python -m unittest discover -s tests
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: xhs-downloader:verify
          cache-from: type=gha,scope=nas-xhs
          cache-to: type=gha,mode=max,scope=nas-xhs
      - name: Run regression in the actual image
        run: docker run --rm -v "$PWD/tests:/tests:ro" -e XHS_SOURCE_ROOT=/app --entrypoint python xhs-downloader:verify -m unittest discover -s /tests
      - uses: docker/build-push-action@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ccawmiku/xhs-downloader:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=nas-xhs
